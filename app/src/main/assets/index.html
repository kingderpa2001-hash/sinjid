<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#p{width:100vw;height:100vh}</style>
<script>window.RufflePlayer={config:{publicPath:"ruffle/"}};</script>
<script src="ruffle/ruffle.js"></script>
</head><body><div id="p"></div>
<script>
window.addEventListener("load",function(){
  var r=window.RufflePlayer.newest(), p=r.createPlayer();
  p.style.width="100%";p.style.height="100%";
  document.getElementById("p").appendChild(p);
  p.ruffle().load({url:"game.swf",autoplay:"on",unmuteOverlay:"hidden",letterbox:"on",scale:"showAll",splashScreen:false});
});
</script></body></html>

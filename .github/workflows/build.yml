name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download Ruffle
        run: |
          npm pack @ruffle-rs/ruffle
          mkdir -p app/src/main/assets/ruffle
          tar -xzf ruffle-rs-ruffle-*.tgz -C /tmp
          cp -r /tmp/package/* app/src/main/assets/ruffle/
          ls app/src/main/assets/ruffle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Sinjid-apk
          path: app/build/outputs/apk/debug/app-debug.apk
